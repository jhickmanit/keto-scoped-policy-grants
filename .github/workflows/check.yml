name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.23.x'
          cache: false
      - name: Check Go and shell code
        working-directory: legacy
        run: make check
      - name: Verify generated files are current
        working-directory: legacy
        run: |
          make generate
          git diff --exit-code -- setup-a-grants/ setup-b-direct/
      - name: Verify hybrid OPLs are current
        run: |
          python3 -I tools/add_standard_roles.py examples/mapping.json opl/base.ts >opl/hybrid.ts
          python3 -I tools/add_standard_roles.py examples/mapping-decoded.json opl/base-decoded.ts >opl/hybrid-decoded.ts
          git diff --exit-code -- opl/
      - name: Check shell syntax
        run: bash -n test/run.sh test/all.sh
